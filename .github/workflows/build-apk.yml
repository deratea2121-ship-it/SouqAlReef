name: Build Souq Al Reef APK 2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q "SouqAlReef_PhoneBuild 1.zip" -d project

      - name: Find Android project
        run: |
          SETTINGS=$(find project -name settings.gradle.kts -type f | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "Android project not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      -       -       - name: Create Gradle Java 17 override
        run: |
          mkdir -p "$HOME/.gradle/init.d"

          cat > "$HOME/.gradle/init.d/java17.gradle" <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.matching {
                  it.class.name == 'org.jetbrains.kotlin.gradle.tasks.KotlinCompile'
              }.configureEach {
                  kotlinOptions.jvmTarget = "17"
              }
          }
          EOF
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Souq-Al-Reef-APK
          path: |
            project/**/build/outputs/apk/**/*.apk
