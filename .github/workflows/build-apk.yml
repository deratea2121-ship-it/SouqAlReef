name: Build Souq Al Reef APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q "SouqAlReef_PhoneBuild 1.zip" -d project

      - name: Find Android project
        run: |
          SETTINGS=$(find project -name settings.gradle.kts -type f | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Disable JVM target validation
        run: |
          echo "kotlin.jvm.target.validation.mode=ignore" >> "$PROJECT_DIR/gradle.properties"
      - name: Show MainActivity errors
        run: |
          FILE=$(find project -name MainActivity.kt -type f -print -quit)
          echo "FILE=$FILE"

          if [ -z "$FILE" ]; then
          echo "MainActivity.kt not found"
          find project -name MainActivity.kt -type f
          exit 1
          fi
          echo "===== MAIN ACTIVITY LINES 75-100 ====="
          nl -ba "$FILE" | sed -n "75,100p"
      - name: Build APK
        run: |
          FILE=$(find project -name MainActivity.kt -type f | head -1)
           echo "===== IMPORTS ====="
          nl -ba "$FILE" | sed -n '1,74p'
          echo "===== APP GRADLE ====="
          find project -name "build.gradle.kts" -path "*/app/*" -print -exec cat {} \;
          echo "===== END APP GRADLE ====="
          echo "===== CODE CHECK ====="
           nl -ba "$FILE" | sed -n '50,60p'
           nl -ba "$FILE" | sed -n '84,94p'
           echo "===== END CODE CHECK ====="
            exit 1
          python3 - "$FILE" <<'PY'
          import sys

          p = sys.argv[1]

          with open(p, "r", encoding="utf-8") as f:
              s = f.read()

          # إزالة القوس الزائد قبل Login
          s = s.replace("\n}\n\n@Composable fun Login", "\n\n@Composable fun Login", 1)

          # إصلاح NavItem
          start = s.index("@Composable fun NavItem(")
          end = s.index("@Composable fun Home(", start)

          nav = '''@Composable
          fun NavItem(icon:androidx.compose.ui.graphics.vector.ImageVector,label:String,selected:Boolean,onClick:()->Unit){
              androidx.compose.material3.NavigationBarItem(
                  selected=selected,
                  onClick=onClick,
                  icon={Icon(icon,null)},
                  label={Text(label,fontSize=10.sp)}
              )
          }

          '''

          s = s[:start] + nav + s[end:]

          # إصلاح Cart
          start = s.index("@Composable fun Cart(")
          end = s.index("@Composable fun Orders(", start)

          cart = '''@Composable
          fun Cart(db:MarketDb,user:Long,refresh:()->Unit){
              val lines=db.cart(user)
              val total=lines.sumOf{it.product.price*it.qty}

              Column(
                  Modifier.fillMaxSize().background(Bg)
              ){
                  Header()
                  Text(
                      "سلة المشتريات",
                      fontSize=24.sp,
                      fontWeight=FontWeight.Bold,
                      modifier=Modifier.padding(18.dp)
                  )

                  if(lines.isEmpty()){
                      Text(
                          "السلة فارغة",
                          modifier=Modifier.padding(18.dp)
                      )
                  }else{
                      LazyColumn(
                          Modifier.weight(1f)
                      ){
                          items(lines){l->
                              Text(
                                  "${l.product.name} × ${l.qty} = ${l.product.price*l.qty} ل.س",
                                  modifier=Modifier
                                      .fillMaxWidth()
                                      .padding(14.dp)
                              )
                          }
                      }

                      Text(
                          "الإجمالي: $total ل.س",
                          fontWeight=FontWeight.Bold,
                          fontSize=20.sp,
                          modifier=Modifier.padding(16.dp)
                      )

                      Button(
                          onClick={
                              db.createOrder(user,"الدفع عند الاستلام")
                              refresh()
                          },
                          modifier=Modifier
                              .fillMaxWidth()
                              .padding(16.dp)
                      ){
                          Text("تأكيد الطلب والدفع عند الاستلام")
                      }

                      Button(
                          onClick={
                              db.createOrder(user,"الدفع الإلكتروني")
                              refresh()
                          },
                          modifier=Modifier
                              .fillMaxWidth()
                              .padding(horizontal=16.dp)
                      ){
                          Text("الدفع الإلكتروني (يتطلب بوابة دفع)")
                      }
                  }
              }
          }

          '''

          s = s[:start] + cart + s[end:]

          with open(p, "w", encoding="utf-8") as f:
              f.write(s)
          PY

          cd "$PROJECT_DIR"
                    echo "===== IMPORTS ====="
          nl -ba "$FILE" | sed -n '1,75p'
          echo "===== END IMPORTS ====="
          gradle assembleDebug --no-daemon
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Souq-Al-Reef-APK
          path: |
            project/**/build/outputs/apk/**/*.apk
