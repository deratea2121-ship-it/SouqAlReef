name: Build Souq Al Reef APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q "SouqAlReef_PhoneBuild 1.zip" -d project

      - name: Find Android project
        run: |
          SETTINGS=$(find project -name settings.gradle.kts -type f | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Match Kotlin to Java 8
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/kotlin8.gradle" <<'EOF'
          import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

          allprojects {
              tasks.withType(KotlinCompile).configureEach {
                  kotlinOptions.jvmTarget = "1.8"
              }
          }
          EOF
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Souq-Al-Reef-APK
          path: |
            project/**/build/outputs/apk/**/*.apk
